<!doctype html>
<!--
  🎙 Мини-приложение «Поговорить с Market Guru» для бота @Market_Guru_Uz_Bot.
  Лицо-голограмма (картинки из ChatGPT, папка face/): основа с закрытым ртом + накладки «рот приоткрыт»,
  «рот открыт», «глаза закрыты». Когда бот говорит, накладки рта плавно проявляются по громкости его голоса;
  моргает само. Фон — тёмно-синий в цвет картинки, края лица растворяются в нём, вокруг плавают частицы.
  Человек говорит — к лицу текут голубые частицы-звук; распознаю — по лицу бежит луч; думаю — вокруг головы
  кружат искры; готовлю голос — лицо мерцает. Шаги 🎧 → 🧠 → 🔊 под лицом.
  Разговор: запись → сервер бота (talk_server.py, адрес в ?api=…, через туннель): /api/stt → /api/answer →
  /api/speak. Без ?api= — режим проверки: бот повторяет запись человека.
  Параметры ссылки: ?v=версия&lang=ru|uz&api=https://… Ключей и данных на странице нет — она лежит на открытом
  GitHub Pages (репозиторий market-guru-app); сервер сам проверяет подпись Telegram (initData).
  После правок: скопировать этот файл и папку face/ в market-guru-app и отправить (Push).
  Исходники кадров: webapp/face_src (сетка 2×2 из ChatGPT), сборка кадров — выравнивание по носу, мягкие края.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Market Guru</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Всегда тёмная тема — в цвет голограммы, чтобы лицо и фон были одним целым */
  :root {
    --bg: #030b1a;
    --text: #e6f0ff;
    --hint: #8ea6cc;
    --card: rgba(120, 170, 255, .10);
    --accent: #3b82f6;
    --glow: #67b7ff;
    --rec: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         -webkit-user-select: none; user-select: none; }
  #bg, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #bg { z-index: 0; }
  #fx { z-index: 2; }
  main { position: relative; z-index: 1; height: 100%; max-width: 560px; margin: 0 auto; padding: 0 12px 10px;
         display: flex; flex-direction: column; align-items: center; }
  .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  /* Лицо: квадрат на всё свободное место; края мягко растворяются в фоне */
  .face { position: relative; height: 100%; max-width: 100%; aspect-ratio: 1 / 1; will-change: transform, filter;
          -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 47%, #000 58%, transparent 99%);
          mask-image: radial-gradient(ellipse 50% 50% at 50% 47%, #000 58%, transparent 99%); }
  .face img { position: absolute; display: block; pointer-events: none; }
  .face .base { inset: 0; width: 100%; height: 100%; }
  /* Накладки — координаты из кадра 627×627 (рот 200,330–430,470; глаза 120,150–510,270) */
  .face .mouth { left: 31.90%; top: 52.63%; width: 36.68%; height: 22.33%; opacity: 0; }
  .face .eyes { left: 19.14%; top: 23.92%; width: 62.20%; height: 19.14%; opacity: 0; }
  .status { min-height: 20px; text-align: center; font-size: 15px; font-weight: 600; margin: 2px 0 0;
            text-shadow: 0 0 12px rgba(103, 183, 255, .5); }
  .sub { min-height: 18px; text-align: center; font-size: 12px; color: var(--hint); margin: 0 0 8px; }
  .sub.err { color: #ff8a8a; }
  .sub.ok { color: #6ee7b7; }
  .mic { width: 64px; height: 64px; border-radius: 50%; border: 0; color: #fff; font-size: 26px; cursor: pointer;
         background: radial-gradient(circle at 35% 30%, #60a5fa, #1d4ed8);
         box-shadow: 0 0 22px rgba(59, 130, 246, .55), inset 0 0 10px rgba(255, 255, 255, .25);
         transition: transform .15s, background .2s, opacity .2s; }
  .mic:active { transform: scale(.94); }
  .mic.rec { background: radial-gradient(circle at 35% 30%, #f87171, #b91c1c);
             box-shadow: 0 0 0 6px rgba(239, 68, 68, .25), 0 0 22px rgba(239, 68, 68, .5); }
  .mic:disabled { opacity: .45; }
  .btn-label { margin-top: 3px; font-size: 12px; color: var(--hint); }
  /* Под лицом — одна строка ответа; нажатие — весь текст на весь экран */
  .bubble { width: 100%; background: var(--card); border: 1px solid rgba(120, 170, 255, .18); border-radius: 12px;
            padding: 6px 10px; margin: 0 0 4px; font-size: 13px; display: none; cursor: pointer;
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: 1; }
  .bubble .heard { color: var(--hint); font-size: 11px; }
  .bubble .row { display: flex; align-items: baseline; gap: 8px; }
  .bubble .short { flex: 1; min-width: 0; }
  .bubble .more { color: var(--glow); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: none; flex-direction: column; }
  .sheet.open { display: flex; }
  .sheet-head { display: flex; justify-content: flex-end; padding: 10px 12px; border-bottom: 1px solid var(--card); }
  .sheet-close { border: 0; background: var(--card); color: var(--text); border-radius: 18px; padding: 8px 16px;
                 font-size: 15px; cursor: pointer; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 14px 18px 30px; font-size: 17px; line-height: 1.5;
                white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
  .sheet-body .heard { color: var(--hint); font-size: 14px; margin-bottom: 12px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .stop { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(120, 170, 255, .3);
          background: var(--card); color: var(--text); font-size: 18px; cursor: pointer; display: none; }
  .stop.show { display: block; }
  .stop:active { transform: scale(.94); }
  /* Шаги ожидания 🎧 → 🧠 → 🔊: текущий светится и «дышит», пройденные — зелёные */
  .steps { display: none; align-items: center; gap: 6px; margin: 2px 0 0; }
  .steps.show { display: flex; }
  .steps span { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
                justify-content: center; font-size: 15px; background: var(--card); opacity: .45;
                transition: opacity .3s, transform .3s, background .3s; }
  .steps span.done { opacity: .95; background: rgba(110, 231, 183, .25); }
  .steps span.active { opacity: 1; background: rgba(103, 183, 255, .3); box-shadow: 0 0 0 3px rgba(103, 183, 255, .45),
                       0 0 14px rgba(103, 183, 255, .6); animation: pulse 1s ease-in-out infinite; }
  .steps i { width: 16px; height: 2px; background: var(--card); border-radius: 1px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  .note { margin-top: 6px; font-size: 11px; color: var(--hint); text-align: center; max-width: 360px; }
  .note:empty { display: none; }
  .diag { margin-top: 2px; font-size: 9px; color: var(--hint); opacity: .45; text-align: center; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <div class="stage">
    <div class="face" id="face">
      <img class="base" id="imgBase" alt="Market Guru">
      <img class="mouth" id="imgHalf" alt="">
      <img class="mouth" id="imgOpen" alt="">
      <img class="eyes" id="imgEyes" alt="">
    </div>
  </div>

  <div class="bubble" id="bubble">
    <div class="heard clamp" id="heard"></div>
    <div class="row"><div class="short clamp" id="answer"></div><div class="more" id="more"></div></div>
  </div>
  <div class="steps" id="steps"><span>🎧</span><i></i><span>🧠</span><i></i><span>🔊</span></div>
  <div class="status" id="status"></div>
  <div class="sub" id="sub"></div>
  <div class="controls">
    <button class="stop" id="stop" aria-label="stop">⏹</button>
    <button class="mic" id="mic" aria-label="mic">🎙</button>
  </div>
  <div class="btn-label" id="btnLabel"></div>
  <div class="note" id="note"></div>
  <div class="diag" id="diag"></div>
</main>
<canvas id="fx"></canvas>
<div class="sheet" id="sheet">
  <div class="sheet-head"><button class="sheet-close" id="sheetClose"></button></div>
  <div class="sheet-body"><div class="heard" id="sheetHeard"></div><div id="sheetAnswer"></div></div>
</div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("#030b1a"); tg.setBackgroundColor("#030b1a"); } catch (e) {}
  }

  const params = new URLSearchParams(location.search);
  const code = params.get("lang") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user &&
                                      tg.initDataUnsafe.user.language_code) || "ru";
  // Язык окна: сначала — как выбран в боте; после ответа — язык, на котором человек говорит (язык ответа ИИ).
  let lang = String(code).startsWith("uz") ? "uz" : "ru";
  let T;

  const TEXTS = {
    ru: {
      idle: "Привет! Я Market Guru", idleSub: "Нажмите на кнопку и скажите что-нибудь",
      start: "Говорить", stop: "Готово",
      listening: "Слушаю…", listeningSub: "Говорите, потом нажмите «Готово»",
      thinking: "Думаю…", speaking: "Повторяю, что услышал",
      ok: "✅ Микрофон и звук работают. Попробуйте ещё раз!",
      note: "Это проверка: пока Market Guru повторяет вашу запись. Скоро здесь будут его голос и ответы ИИ.",
      noMic: "В этом окне микрофон недоступен. Напишите, какой у вас телефон — разберёмся.",
      denied: "Нет доступа к микрофону. Разрешите его для Telegram в настройках телефона и откройте окно снова.",
      short: "Слишком коротко — скажите чуть дольше.",
      fail: "Не получилось: ",
      idleLive: "Задайте вопрос голосом — отвечу голосом и текстом",
      noteLive: "Говорите коротко, до 1 минуты. Цифры и расчёты удобнее смотреть в чате бота.",
      thinkingLive: "Думаю над ответом…", speakingLive: "Отвечаю",
      recognizing: "Распознаю речь…", voicing: "Готовлю голос…",
      heard: "🎤 Вы сказали: ", againSub: "Можно спросить ещё",
      interrupt: "Перебить", speakingSub: "⏹ — замолчать, 🎙 — перебить и сказать своё",
      more: "Весь ответ ›", close: "✕ Закрыть",
      errors: {
        auth: "Откройте окно заново из меню бота.",
        closed: "Разговор голосом пока закрыт — скоро откроем!",
        ai_off: "ИИ-помощник пока не подключён.",
        stt_off: "Распознавание голоса пока не подключено.",
        limit: "На сегодня лимит вопросов исчерпан. Возвращайтесь завтра!",
        too_long: "Слишком длинно — уложитесь в 1 минуту.",
        no_audio: "Запись пустая — попробуйте ещё раз.",
        not_heard: "Не разобрал слова. Скажите чуть громче и ближе к телефону.",
        stt_error: "Не получилось распознать. Попробуйте ещё раз через минуту.",
        ai_error: "Не получилось ответить. Попробуйте ещё раз через минуту.",
        network: "Нет связи с ботом. Проверьте интернет или откройте окно заново из меню бота.",
      },
    },
    uz: {
      idle: "Salom! Men Market Guru", idleSub: "Tugmani bosing va biror narsa ayting",
      start: "Gapirish", stop: "Tayyor",
      listening: "Tinglayapman…", listeningSub: "Gapiring, keyin «Tayyor»ni bosing",
      thinking: "O'ylayapman…", speaking: "Eshitganimni takrorlayapman",
      ok: "✅ Mikrofon va ovoz ishlayapti. Yana urinib ko'ring!",
      note: "Bu sinov: hozircha Market Guru yozuvingizni takrorlaydi. Tez orada bu yerda uning ovozi va AI javoblari bo'ladi.",
      noMic: "Bu oynada mikrofon ishlamayapti. Telefoningiz qanaqa ekanini yozing — hal qilamiz.",
      denied: "Mikrofonga ruxsat yo'q. Telefon sozlamalarida Telegram'ga ruxsat bering va oynani qayta oching.",
      short: "Juda qisqa — biroz uzoqroq gapiring.",
      fail: "Bo'lmadi: ",
      idleLive: "Savolingizni ovoz bilan bering — ovoz va matn bilan javob beraman",
      noteLive: "Qisqa gapiring, 1 daqiqagacha. Raqam va hisob-kitoblarni bot chatida ko'rish qulayroq.",
      thinkingLive: "Javob ustida o'ylayapman…", speakingLive: "Javob beryapman",
      recognizing: "Nutqni tanyapman…", voicing: "Ovoz tayyorlayapman…",
      heard: "🎤 Siz aytdingiz: ", againSub: "Yana so'rashingiz mumkin",
      interrupt: "Gapni bo'lish", speakingSub: "⏹ — jim bo'lish, 🎙 — gapni bo'lib, o'zingiz aytish",
      more: "To'liq ›", close: "✕ Yopish",
      errors: {
        auth: "Oynani bot menyusidan qayta oching.",
        closed: "Ovozli suhbat hozircha yopiq — tez orada ochamiz!",
        ai_off: "AI-yordamchi hali ulanmagan.",
        stt_off: "Ovozni tanish hali ulanmagan.",
        limit: "Bugungi savollar limiti tugadi. Ertaga qayting!",
        too_long: "Juda uzun — 1 daqiqaga sig'diring.",
        no_audio: "Yozuv bo'sh — qayta urinib ko'ring.",
        not_heard: "So'zlarni tushunmadim. Biroz balandroq va telefonga yaqinroq gapiring.",
        stt_error: "Tanib bo'lmadi. Bir daqiqadan so'ng qayta urinib ko'ring.",
        ai_error: "Javob bera olmadim. Bir daqiqadan so'ng qayta urinib ko'ring.",
        network: "Bot bilan aloqa yo'q. Internetni tekshiring yoki oynani bot menyusidan qayta oching.",
      },
    },
  };

  const $ = (id) => document.getElementById(id);
  const el = {
    face: $("face"), base: $("imgBase"), half: $("imgHalf"), open: $("imgOpen"), eyes: $("imgEyes"),
    bg: $("bg"), fx: $("fx"),
    status: $("status"), sub: $("sub"), mic: $("mic"), btnLabel: $("btnLabel"), note: $("note"), diag: $("diag"),
    bubble: $("bubble"), heard: $("heard"), answer: $("answer"), more: $("more"), stop: $("stop"), steps: $("steps"),
    sheet: $("sheet"), sheetClose: $("sheetClose"), sheetHeard: $("sheetHeard"), sheetAnswer: $("sheetAnswer"),
  };

  // Кадры лица (версия в ссылке — чтобы Telegram не держал старые картинки)
  const V = encodeURIComponent(params.get("v") || "1");
  el.base.src = `face/base.jpg?v=${V}`;
  el.half.src = `face/mouth_half.webp?v=${V}`;
  el.open.src = `face/mouth_open.webp?v=${V}`;
  el.eyes.src = `face/eyes_closed.webp?v=${V}`;

  // Адрес сервера бота (через туннель). Принимаем только https — без него режим проверки.
  const API = (params.get("api") || "").startsWith("https://") ? params.get("api").replace(/\/+$/, "") : "";

  function applyLang(l) {
    lang = l === "uz" ? "uz" : "ru";
    document.documentElement.lang = lang;
    T = Object.assign({}, TEXTS[lang]);
    if (API) {
      T.idleSub = T.idleLive; T.note = T.noteLive; T.thinking = T.thinkingLive; T.speaking = T.speakingLive;
    }
    el.note.textContent = API ? "" : T.note;   // в разговоре подсказку не показываем — место для лица
    el.more.textContent = T.more;
    el.sheetClose.textContent = T.close;
    const h = el.sheetHeard.dataset.text;   // «Вы сказали» — тоже на новом языке
    if (h) el.heard.textContent = el.sheetHeard.textContent = T.heard + "«" + h + "»";
  }
  applyLang(lang);

  // Под лицом — одна строка; нажатие — весь текст на весь экран.
  function showBubble(heard, answer) {
    const h = heard ? T.heard + "«" + heard + "»" : "";
    el.sheetHeard.dataset.text = heard || "";
    el.heard.textContent = el.sheetHeard.textContent = h;
    el.answer.textContent = el.sheetAnswer.textContent = answer || "";
    el.more.style.display = answer ? "block" : "none";
    el.bubble.style.display = heard || answer ? "block" : "none";
  }
  el.bubble.addEventListener("click", () => {
    if (!el.sheetAnswer.textContent) return;
    el.sheet.classList.add("open");
    el.sheet.querySelector(".sheet-body").scrollTop = 0;
  });
  el.sheetClose.addEventListener("click", () => el.sheet.classList.remove("open"));

  const MAX_MS = 60000;   // как у голосовых в боте: не дольше минуты
  let state = "idle";
  let ctx = null, analyser = null, data = null, micStream = null, micAnalyser = null, recorder = null, chunks = [];
  let recStart = 0, maxTimer = null, level = 0;

  function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind); } catch (e) {} }

  function setSub(text, cls) { el.sub.textContent = text || ""; el.sub.className = "sub" + (cls ? " " + cls : ""); }

  function setState(s, sub, cls) {
    state = s;
    const texts = { idle: T.idle, listening: T.listening, recognizing: T.recognizing, thinking: T.thinking,
                    voicing: T.voicing, speaking: T.speaking };
    el.status.textContent = texts[s];
    // шаги ожидания: 🎧 распознаю → 🧠 думаю → 🔊 готовлю голос
    const order = ["recognizing", "thinking", "voicing"];
    const cur = order.indexOf(s);
    el.steps.classList.toggle("show", cur >= 0);
    el.steps.querySelectorAll("span").forEach((sp, i) => {
      sp.className = i < cur ? "done" : i === cur ? "active" : "";
    });
    if (sub !== undefined) setSub(sub, cls);
    else setSub(s === "idle" ? T.idleSub : s === "listening" ? T.listeningSub
                : s === "speaking" && API ? T.speakingSub : "");
    el.mic.classList.toggle("rec", s === "listening");
    el.mic.textContent = s === "listening" ? "⏹" : "🎙";
    el.btnLabel.textContent = s === "listening" ? T.stop : s === "speaking" ? T.interrupt : T.start;
    el.mic.disabled = s === "thinking" || s === "recognizing" || s === "voicing";
    el.stop.classList.toggle("show", s === "speaking");   // ⏹ — замолчать, не задавая нового вопроса
  }

  function diag(extra) {
    const mr = typeof window.MediaRecorder !== "undefined";
    const gum = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    el.diag.textContent = [
      tg ? `Telegram ${tg.platform || "?"} ${tg.version || ""}` : "browser", API ? "live" : "test",
      `mic:${gum ? "yes" : "no"}`, `rec:${mr ? "yes" : "no"}`, extra || "",
    ].filter(Boolean).join(" · ");
  }
  diag();

  // ───────── уровень громкости (микрофон или голос бота) ─────────
  function readLevel() {
    if (!analyser) return 0;
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
    return Math.min(1, Math.sqrt(sum / data.length) * 4.5);
  }

  function makeAnalyser() {
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    data = new Uint8Array(analyser.fftSize);
    return analyser;
  }

  // ───────── запись ─────────
  async function startRec() {
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || typeof MediaRecorder === "undefined") {
      setState("idle", T.noMic, "err"); diag("no-api"); return;
    }
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") await ctx.resume();   // звук разрешён только после нажатия — нажатие есть
      // Микрофон включаем один раз на всё время, пока окно открыто: иначе Telegram спрашивает разрешение
      // перед каждым вопросом. Выключаем, когда окно свернули или закрыли.
      if (!micLive()) {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        micAnalyser = ctx.createAnalyser();
        micAnalyser.fftSize = 1024;
        ctx.createMediaStreamSource(micStream).connect(micAnalyser);
      }
    } catch (e) {
      const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError" || e.name === "PermissionDeniedError");
      setState("idle", denied ? T.denied : T.fail + (e && e.name || e), "err"); diag(e && e.name); return;
    }
    analyser = micAnalyser;
    data = new Uint8Array(analyser.fftSize);
    const types = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus", "audio/webm"];
    const mime = types.find((m) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    try {
      recorder = mime ? new MediaRecorder(micStream, { mimeType: mime }) : new MediaRecorder(micStream);
    } catch (e) {
      stopMic(); setState("idle", T.fail + (e && e.name || e), "err"); diag("recorder:" + (e && e.name)); return;
    }
    chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = onRecorded;
    recorder.start();
    recStart = performance.now();
    diag(recorder.mimeType || mime || "default");
    haptic("medium");
    setState("listening");
    maxTimer = setTimeout(stopRec, MAX_MS);
  }

  function micLive() {
    return !!(micStream && micStream.getAudioTracks().some((t) => t.readyState === "live"));
  }

  function stopMic() {
    if (recorder && recorder.state === "recording") recorder.stop();
    if (micStream) micStream.getTracks().forEach((t) => t.stop());
    micStream = null;
    micAnalyser = null;
  }
  // Окно свернули / закрыли — микрофон выключаем (при следующем вопросе Telegram спросит разрешение заново).
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopMic(); });
  window.addEventListener("pagehide", stopMic);

  function stopRec() {
    clearTimeout(maxTimer);
    if (recorder && recorder.state === "recording") recorder.stop();
    haptic("light");
  }

  function decode(buf) {
    return new Promise((resolve, reject) => {
      const p = ctx.decodeAudioData(buf, resolve, reject);
      if (p && p.then) p.then(resolve, reject);
    });
  }

  async function onRecorded() {
    analyser = null;
    if (performance.now() - recStart < 700 || !chunks.length) { setState("idle", T.short, "err"); return; }
    const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || "audio/webm" });
    if (API) { ask(blob); return; }
    setState("thinking");
    try {
      const audio = await decode(await blob.arrayBuffer());
      await new Promise((r) => setTimeout(r, 900));   // «думает»
      speak(audio, () => setState("idle", T.ok, "ok"));
    } catch (e) {
      setState("idle", T.fail + (e && e.name || e), "err"); diag("decode:" + (e && e.name));
    }
  }

  // ───────── разговор в три шага: 🎧 распознаю → 🧠 думаю → 🔊 готовлю голос → говорит ─────────
  async function call(path, fields, timeoutMs) {
    const form = new FormData();
    form.append("init_data", (tg && tg.initData) || "");
    form.append("lang", lang);
    for (const [k, v] of fields) Array.isArray(v) ? form.append(k, v[0], v[1]) : form.append(k, v);
    const abort = new AbortController();
    const timer = setTimeout(() => abort.abort(), timeoutMs);
    try {
      const r = await fetch(API + path, { method: "POST", body: form, signal: abort.signal });
      return await r.json();
    } catch (e) {
      diag("net:" + (e && e.name));
      return { ok: false, error: "network" };
    } finally {
      clearTimeout(timer);
    }
  }

  function failed(res) {
    setState("idle", T.errors[res.error] || (T.fail + res.error), "err");
    haptic("heavy");
  }

  async function ask(blob) {
    showBubble("", "");
    setState("recognizing");
    const type = (blob.type || "audio/webm").split(";")[0];
    const heard = await call("/api/stt", [["audio", [blob, "voice." + (type.split("/")[1] || "webm")]]], 45000);
    if (!heard.ok) return failed(heard);
    showBubble(heard.heard, "");

    setState("thinking");
    const res = await call("/api/answer", [["text", heard.heard]], 90000);
    if (!res.ok) return failed(res);
    if (res.answer_lang) applyLang(res.answer_lang);   // человек говорит по-узбекски — и окно по-узбекски
    showBubble(heard.heard, res.answer);
    if (!res.voice) { setState("idle", T.againSub); return; }   // на этом языке озвучки нет — только текст

    setState("voicing");
    const sp = await call("/api/speak", [], 45000);
    if (!sp.ok || !sp.audio) { setState("idle", T.againSub); return; }   // голос не вышел — текст уже на экране
    try {
      const bin = atob(sp.audio);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      speak(await decode(bytes.buffer), () => setState("idle", T.againSub));
    } catch (e) {
      setState("idle", T.againSub); diag("play:" + (e && e.name));
    }
  }

  // ───────── бот «говорит»: рот по громкости звука ─────────
  let speaking = null;   // звук, который бот сейчас говорит (чтобы можно было перебить)

  function speak(audioBuffer, onEnd) {
    const src = ctx.createBufferSource();
    src.buffer = audioBuffer;
    src.connect(makeAnalyser());
    analyser.connect(ctx.destination);
    src.onended = () => { speaking = null; analyser = null; onEnd(); };
    speaking = src;
    setState("speaking");
    src.start();
  }

  // Замолчать сразу (селлер перебил или нажал ⏹). onended не вызываем — дальше решает тот, кто перебил.
  function hush() {
    if (!speaking) return;
    speaking.onended = null;
    try { speaking.stop(); } catch (e) {}
    speaking = null;
    analyser = null;
  }

  el.mic.addEventListener("click", () => {
    if (state === "idle") startRec();
    else if (state === "listening") stopRec();
    else if (state === "speaking") { hush(); startRec(); }   // перебить: бот замолкает и сразу слушает
  });
  el.stop.addEventListener("click", () => {
    if (state !== "speaking") return;
    hush();
    haptic("light");
    setState("idle", API ? T.againSub : T.ok, API ? "" : "ok");
  });

  // ───────── анимация: фон, лицо, эффекты ─────────
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const bgc = el.bg.getContext("2d"), fxc = el.fx.getContext("2d");
  let VW = 0, VH = 0;
  function resize() {
    VW = window.innerWidth; VH = window.innerHeight;
    for (const c of [el.bg, el.fx]) { c.width = VW * DPR; c.height = VH * DPR; }
    bgc.setTransform(DPR, 0, 0, DPR, 0, 0);
    fxc.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // Фон: медленно плывущие мерцающие частицы (как на картинке) + мягкое свечение за лицом
  const stars = Array.from({ length: 70 }, () => ({
    x: Math.random(), y: Math.random(), r: 0.4 + Math.random() * 1.6, s: 0.002 + Math.random() * 0.006,
    p: Math.random() * Math.PI * 2,
  }));
  // Эффекты: частицы-звук (летят к лицу), искры-мысли (кружат)
  const flow = [];

  let blinkStart = -1, nextBlink = performance.now() + 1800, mouth = 0, prev = performance.now();
  function scheduleBlink(now) {
    nextBlink = now + 2400 + Math.random() * 3600;
    if (Math.random() < 0.18) nextBlink = now + 320;      // иногда моргает дважды
  }

  function faceRect() {
    const r = el.face.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.47, w: r.width, h: r.height };
  }

  function frame(now) {
    const dt = Math.min(64, now - prev); prev = now;
    const raw = demoLevel !== null ? demoLevel * (0.55 + 0.45 * Math.abs(Math.sin(now / 95)))
      : (state === "listening" || state === "speaking") ? readLevel() : 0;
    level += (raw - level) * (raw > level ? 0.55 : 0.2);
    const F = faceRect();

    // фон
    bgc.clearRect(0, 0, VW, VH);
    const g = bgc.createRadialGradient(F.x, F.y, F.w * 0.1, F.x, F.y, Math.max(VW, VH) * 0.8);
    const glowA = 0.22 + (state === "speaking" ? level * 0.18 : 0) + (state === "thinking" ? 0.06 * Math.sin(now / 300) : 0);
    g.addColorStop(0, `rgba(40, 110, 220, ${glowA.toFixed(3)})`);
    g.addColorStop(1, "rgba(3, 11, 26, 0)");
    bgc.fillStyle = g;
    bgc.fillRect(0, 0, VW, VH);
    for (const s of stars) {
      s.y -= s.s * dt / 16 * 0.15; if (s.y < -0.02) { s.y = 1.02; s.x = Math.random(); }
      const a = 0.25 + 0.55 * Math.abs(Math.sin(now / 900 + s.p));
      bgc.fillStyle = `rgba(140, 200, 255, ${a.toFixed(2)})`;
      bgc.beginPath(); bgc.arc(s.x * VW, s.y * VH, s.r, 0, Math.PI * 2); bgc.fill();
    }

    // лицо: «дыхание», свечение по состоянию
    const breathe = Math.sin(now / 1400);
    let bright = 1 + 0.03 * breathe;
    if (state === "listening") bright += level * 0.22;
    if (state === "speaking") bright += 0.04 + level * 0.12;
    if (state === "voicing") bright += 0.06 * (0.5 + 0.5 * Math.sin(now / 160));
    if (state === "thinking") bright += 0.05 * Math.sin(now / 260);
    el.face.style.transform = `translateY(${(breathe * 2).toFixed(2)}px) scale(${(1 + 0.006 * breathe).toFixed(4)})`;
    el.face.style.filter = `brightness(${bright.toFixed(3)}) drop-shadow(0 0 ${(8 + level * 18).toFixed(0)}px rgba(80,160,255,.35))`;

    // рот: проявляется только когда бот говорит; «приоткрыт» → «открыт» плавно по громкости
    const target = state === "speaking" ? level : 0;
    mouth += (target - mouth) * (target > mouth ? 0.5 : 0.3);
    const halfA = Math.min(1, mouth * 2.4);
    const openA = Math.max(0, Math.min(1, (mouth - 0.32) * 2.2));
    el.half.style.opacity = halfA.toFixed(3);
    el.open.style.opacity = openA.toFixed(3);

    // моргание: 170 мс, плавно закрыть и открыть
    if (now > nextBlink && blinkStart < 0) { blinkStart = now; scheduleBlink(now); }
    let eyesA = 0;
    if (blinkStart >= 0) {
      const t = (now - blinkStart) / 170;
      if (t >= 1) blinkStart = -1; else eyesA = Math.sin(t * Math.PI);
    }
    el.eyes.style.opacity = eyesA.toFixed(3);

    // эффекты поверх
    fxc.clearRect(0, 0, VW, VH);
    // 🎙 слушает: частицы-звук текут снизу к лицу
    if (state === "listening" && level > 0.04 && flow.length < 140) {
      for (let i = 0; i < 1 + Math.round(level * 4); i++) {
        flow.push({ x: F.x + (Math.random() - 0.5) * F.w * 0.9, y: F.y + F.h * 0.65 + Math.random() * 20,
                    t: 0, s: 0.6 + Math.random() * 0.8, r: 1 + Math.random() * 2 * (0.5 + level) });
      }
    }
    for (let i = flow.length - 1; i >= 0; i--) {
      const p = flow[i];
      p.t += dt / 900 * p.s;
      if (p.t >= 1) { flow.splice(i, 1); continue; }
      const k = p.t * p.t;   // ускоряются к лицу
      const x = p.x + (F.x - p.x) * k, y = p.y + (F.y + F.h * 0.08 - p.y) * k;
      fxc.fillStyle = `rgba(120, 200, 255, ${(Math.sin(p.t * Math.PI) * 0.9).toFixed(2)})`;
      fxc.beginPath(); fxc.arc(x, y, p.r, 0, Math.PI * 2); fxc.fill();
    }
    // 🎧 распознаёт: светлый луч пробегает по лицу сверху вниз
    if (state === "recognizing") {
      const t = (now % 1300) / 1300;
      const y = F.y - F.h * 0.4 + t * F.h * 0.8;
      const lg = fxc.createLinearGradient(0, y - 18, 0, y + 18);
      lg.addColorStop(0, "rgba(103,183,255,0)"); lg.addColorStop(0.5, "rgba(160,220,255,.55)");
      lg.addColorStop(1, "rgba(103,183,255,0)");
      fxc.fillStyle = lg;
      fxc.fillRect(F.x - F.w * 0.32, y - 18, F.w * 0.64, 36);
    }
    // 🧠 думает: искры кружат вокруг головы (за головой — тусклее)
    if (state === "thinking") {
      for (let i = 0; i < 4; i++) {
        const a = now / 650 + i * Math.PI / 2;
        const x = F.x + Math.cos(a) * F.w * 0.42, y = F.y - F.h * 0.05 + Math.sin(a) * F.h * 0.1;
        const front = Math.sin(a) > 0;
        const rg = fxc.createRadialGradient(x, y, 0, x, y, 14);
        rg.addColorStop(0, front ? "rgba(220,240,255,.95)" : "rgba(160,210,255,.35)");
        rg.addColorStop(1, "rgba(103,183,255,0)");
        fxc.fillStyle = rg;
        fxc.beginPath(); fxc.arc(x, y, 14, 0, Math.PI * 2); fxc.fill();
      }
    }
    // 🔊 готовит голос: от губ расходятся тонкие кольца
    if (state === "voicing") {
      for (let i = 0; i < 3; i++) {
        const t = ((now / 1100) + i / 3) % 1;
        fxc.strokeStyle = `rgba(140, 210, 255, ${((1 - t) * 0.6).toFixed(2)})`;
        fxc.lineWidth = 1.5;
        fxc.beginPath();
        fxc.ellipse(F.x, F.y + F.h * 0.15, F.w * (0.06 + t * 0.3), F.h * (0.03 + t * 0.14), 0, 0, Math.PI * 2);
        fxc.stroke();
      }
    }

    requestAnimationFrame(frame);
  }

  // Только для проверки внешнего вида без микрофона (?demo=1): MarketGuru.demo("speaking", 0.8)
  let demoLevel = null;
  if (params.get("demo")) {
    window.MarketGuru = { demo(s, lvl) { demoLevel = lvl === undefined ? null : lvl; setState(s); } };
  }

  setState("idle");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
