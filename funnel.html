<!doctype html>
<!--
  🧮 Мини-приложение «Калькулятор воронки» для бота @Market_Guru_Uz_Bot (раздел «📈 Воронка продаж»).
  Открывается кнопкой внизу чата. Всё считается прямо в телефоне; боту цифры уходят, только когда человек
  нажимает «Отправить в чат» (Telegram.WebApp.sendData → handlers/funnel.py, on_app_data).
  Расчёт — как в services/funnel.py (stage_tables, all_together): по каждому шагу «сейчас» и «если поднять только
  его на +1/+2/+3%» (+1% = из 100 человек на одного больше: 6% → 7%), остальные шаги — как сейчас;
  в конце — все три шага вместе. Выручка — итоговая (и маленьким шрифтом прибавка).
  Параметры ссылки: ?lang=ru|uz, &price=… (цена из калькулятора прибыли).
  На странице нет ключей и данных — она лежит на открытом GitHub Pages (репозиторий market-guru-app).
  После правок: скопировать этот файл в market-guru-app и отправить (Push) — страница обновится сама.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Калькулятор воронки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #7b2ff7);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --good: #1aa260;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 96px; }
  h1 { font-size: 20px; margin: 4px 0 4px; }
  .lead { color: var(--hint); margin: 0 0 16px; font-size: 14px; }
  .field { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field input { width: 100%; font-size: 20px; padding: 10px 12px; border-radius: 10px;
                 border: 1.5px solid transparent; background: var(--bg); color: var(--text); outline: none; }
  .field input:focus { border-color: var(--accent); }
  .field .where { color: var(--hint); font-size: 13px; margin-top: 6px; }
  .field .opt { color: var(--hint); font-weight: 400; font-size: 13px; }
  .result { margin-top: 18px; }
  .now { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .now .s { color: var(--hint); font-size: 13px; }
  .now .big { font-size: 22px; font-weight: 700; }
  .explain { color: var(--hint); font-size: 13px; margin: 4px 2px 10px; }
  .stage { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .stage.best { outline: 2px solid var(--good); }
  .stage .head { font-weight: 700; font-size: 17px; }
  .stage .sub { color: var(--hint); font-size: 13px; margin-bottom: 8px; }
  .stage table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .stage th { color: var(--hint); font-weight: 500; font-size: 12px; text-align: right; padding: 2px 0 4px; }
  .stage th:first-child, .stage td:first-child { text-align: left; }
  .stage td { text-align: right; padding: 5px 0; border-top: 1px solid rgba(127, 127, 127, .15); white-space: nowrap; }
  .stage td.step { font-weight: 600; }
  .stage td.gain { font-weight: 700; }
  .stage td.gain small { display: block; color: var(--good); font-weight: 800; font-size: 12px; }
  .stage tr.now td { color: var(--hint); }
  .stage.all { background: transparent; border: 2px dashed var(--good); }
  .stage .badge { display: inline-block; margin-top: 8px; color: var(--good); font-weight: 700; font-size: 14px; }
  .empty { color: var(--hint); text-align: center; padding: 18px 8px; background: var(--card); border-radius: 14px; }
  #send { display: none; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px;
          background: var(--accent); color: var(--accent-text); font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div id="fields"></div>
  <div class="result" id="result"></div>
  <button id="send"></button>
</main>
<script>
(function () {
  "use strict";
  const T = {
    ru: {
      title: "🧮 Калькулятор воронки",
      lead: "Введите цифры товара из кабинета Uzum (Аналитика → Воронка продаж). Результат появится ниже сразу.",
      views: ["👀 Сколько раз товар увидели", "Столбец «Показы»", "15 000"],
      opens: ["👆 Сколько раз открыли карточку", "Столбец «Открыли карточку»", "900"],
      carts: ["🛒 Сколько раз положили в корзину", "Столбец «Добавили в корзину»", "54"],
      orders: ["📦 Сколько штук заказали", "Столбец «Заказали товаров»", "18"],
      price: ["💵 Цена 1 штуки, сум", "Ваша цена продажи", "150 000"],
      example: "Например: ",
      optional: "можно не заполнять",
      empty: "Заполните первые 4 поля — и здесь появится результат 👆",
      now: "Сейчас за период",
      orders_word: "заказов",
      sum: "сум",
      explain: "В каждом блоке: первая строка — как сейчас, ниже — что будет, если поднять только этот шаг. «+1%» — из каждых 100 человек на 1 больше.",
      now_row: "Сейчас ",
      all_head: "🚀 Если поднять все три шага вместе",
      all_sub: "открытия, корзину и заказ — каждый на +1, +2 или +3%",
      now_all: "Сейчас",
      each: function (n) { return "+" + n + "% каждый"; },
      head: { ctr: "👆 Открытия карточки — сейчас ", cart: "🛒 Корзина — сейчас ", order: "📦 Заказ — сейчас " },
      sub: {
        ctr: function (n, of) { return "открыли " + n + " из " + of + " увидевших"; },
        cart: function (n, of) { return "положили в корзину " + n + " из " + of + " открывших"; },
        order: function (n, of) { return "заказали " + n + " из " + of + " положивших в корзину"; }
      },
      col: { ctr: "Открыли", cart: "Корзина", orders: "Заказы", gain: "Выручка" },
      best_badge: "👑 Больше всего денег",
      best: { ctr: "открытия карточки", cart: "корзина", order: "заказ" },
      best_line: "👉 Больше всего денег даст: ",
      send: "Отправить в чат",
      cant: "Для расчёта нужны показы, открытия и корзина больше нуля."
    },
    uz: {
      title: "🧮 Voronka kalkulyatori",
      lead: "Uzum kabinetidan tovar raqamlarini kiriting (Analitika → Sotuv voronkasi). Natija darhol pastda chiqadi.",
      views: ["👀 Tovarni necha marta ko'rishdi", "«Показы» ustuni", "15 000"],
      opens: ["👆 Kartochkani necha marta ochishdi", "«Открыли карточку» ustuni", "900"],
      carts: ["🛒 Savatga necha marta qo'shishdi", "«Добавили в корзину» ustuni", "54"],
      orders: ["📦 Necha dona buyurtma qilishdi", "«Заказали товаров» ustuni", "18"],
      price: ["💵 1 dona narxi, so'm", "Sotish narxingiz", "150 000"],
      example: "Masalan: ",
      optional: "to'ldirmasa ham bo'ladi",
      empty: "Birinchi 4 ta maydonni to'ldiring — natija shu yerda chiqadi 👆",
      now: "Hozir, davr davomida",
      orders_word: "ta buyurtma",
      sum: "so'm",
      explain: "Har bir blokda: birinchi qator — hozirgi holat, pastda — faqat shu bosqichni oshirsangiz nima bo'ladi. «+1%» — har 100 kishidan 1 tasi ko'proq.",
      now_row: "Hozir ",
      all_head: "🚀 Uchala bosqichni birga oshirsangiz",
      all_sub: "ochish, savat va buyurtma — har biri +1, +2 yoki +3% ga",
      now_all: "Hozir",
      each: function (n) { return "har biri +" + n + "%"; },
      head: { ctr: "👆 Kartochkani ochish — hozir ", cart: "🛒 Savat — hozir ", order: "📦 Buyurtma — hozir " },
      sub: {
        ctr: function (n, of) { return "ko'rgan " + of + " kishidan " + n + " tasi ochdi"; },
        cart: function (n, of) { return "ochgan " + of + " kishidan " + n + " tasi savatga qo'shdi"; },
        order: function (n, of) { return "savatga qo'shgan " + of + " kishidan " + n + " tasi buyurtma qildi"; }
      },
      col: { ctr: "Ochdi", cart: "Savat", orders: "Buyurtma", gain: "Tushum" },
      best_badge: "👑 Eng ko'p pul",
      best: { ctr: "kartochkani ochish", cart: "savat", order: "buyurtma" },
      best_line: "👉 Eng ko'p pulni beradi: ",
      send: "Chatga yuborish",
      cant: "Hisoblash uchun ko'rsatish, ochish va savat noldan katta bo'lishi kerak."
    }
  };
  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") === "uz" ? "uz" : "ru";
  const L = T[lang];
  document.documentElement.lang = lang;
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData !== undefined && tg.platform && tg.platform !== "unknown");
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  const FIELDS = ["views", "opens", "carts", "orders", "price"];
  const REQUIRED = 4;
  const STAGES = ["ctr", "cart", "order"];

  document.getElementById("title").textContent = L.title;
  document.getElementById("lead").textContent = L.lead;
  const box = document.getElementById("fields");
  FIELDS.forEach(function (key, i) {
    const f = L[key];
    const div = document.createElement("div");
    div.className = "field";
    div.innerHTML = '<label for="' + key + '"></label><input id="' + key + '" inputmode="numeric" autocomplete="off">' +
                    '<div class="where"></div>';
    div.querySelector("label").textContent = f[0];
    if (i >= REQUIRED) {
      const o = document.createElement("span");
      o.className = "opt";
      o.textContent = " · " + L.optional;
      div.querySelector("label").appendChild(o);
    }
    const inp = div.querySelector("input");
    inp.placeholder = L.example + f[2];
    div.querySelector(".where").textContent = f[1];
    inp.addEventListener("input", function () { format(inp); render(); });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { const next = document.getElementById(FIELDS[i + 1]); if (next) next.focus(); else inp.blur(); }
    });
    box.appendChild(div);
  });
  if (params.get("price")) { document.getElementById("price").value = params.get("price"); format(document.getElementById("price")); }

  function digits(s) { return (s || "").replace(/\D/g, ""); }
  function num(key) { const d = digits(document.getElementById(key).value); return d === "" ? null : Number(d); }
  function money(x) { return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function format(inp) { const d = digits(inp.value).slice(0, 12); inp.value = d === "" ? "" : money(Number(d)); }
  function p1(x) { return x.toFixed(1).replace(".", ","); }
  function per100(x) { return (x >= 10 || Math.abs(x - Math.round(x)) < 0.05) ? String(Math.round(x)) : p1(x); }
  function cnt(x) { return (x >= 100 || Math.abs(x - Math.round(x)) < 0.05) ? money(x) : p1(x); }
  function k(x) { return Math.abs(x) >= 1000 ? Math.round(x / 1000) * 1000 : x; }

  // Как в services/funnel.py: stage_tables()
  function tables(v) {
    const rates = {
      ctr: v.views ? v.opens / v.views * 100 : null,
      cart: v.opens ? v.carts / v.opens * 100 : null,
      order: v.carts ? v.orders / v.carts * 100 : null
    };
    function ordersWith(stage, step) {
      let n = v.views;
      for (const s of STAGES) {
        if (rates[s] === null) return null;
        n *= Math.min(100, rates[s] + (s === stage ? step : 0)) / 100;
      }
      return n;
    }
    const have = { ctr: [v.opens, v.views], cart: [v.carts, v.opens], order: [v.orders, v.carts] };
    const out = [];
    for (const s of STAGES) {
      const r = rates[s];
      if (r === null || r >= 100 || ordersWith(null, 0) === null) continue;
      const rows = [1, 2, 3].map(function (step) {
        const nr = Math.min(100, r + step);
        return { step: step, rate: nr, count: have[s][1] * nr / 100, orders: ordersWith(s, step) };
      });
      out.push({ stage: s, rate: r, count: have[s][0], of: have[s][1], rows: rows });
    }
    // Как в services/funnel.py: all_together() — все три шага сразу на +1/+2/+3% каждый
    let together = [];
    if (out.length === STAGES.length) {
      together = [1, 2, 3].map(function (step) {
        let n = v.views;
        for (const s of STAGES) n *= Math.min(100, rates[s] + step) / 100;
        return { step: step, orders: n };
      });
    }
    return { list: out, together: together };
  }

  function moneyCell(tr, orders, base, price, exact) {
    const td = el("td", "gain", money(exact ? orders * price : k(orders * price)));
    if (!exact) td.appendChild(el("small", "", "+" + money(k((orders - base) * price))));
    tr.appendChild(td);
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function render() {
    const v = {};
    FIELDS.forEach(function (f) { v[f] = num(f); });
    const res = document.getElementById("result");
    res.innerHTML = "";
    const ready = FIELDS.slice(0, REQUIRED).every(function (f) { return v[f] !== null; }) && (v.views > 0 || v.opens > 0);
    setSend(ready);
    if (!ready) { res.appendChild(el("div", "empty", L.empty)); return; }
    const price = v.price && v.price >= 100 ? v.price : null;

    const now = el("div", "now");
    now.appendChild(el("div", "s", L.now));
    now.appendChild(el("div", "big", cnt(v.orders) + " " + L.orders_word + (price ? " · " + money(v.orders * price) + " " + L.sum : "")));
    res.appendChild(now);

    const t = tables(v);
    const list = t.list;
    if (!list.length) { res.appendChild(el("div", "empty", L.cant)); return; }
    res.appendChild(el("div", "explain", L.explain));
    const best = list.slice().sort(function (a, b) { return b.rows[0].orders - a.rows[0].orders; })[0].stage;

    function head(table, cols) {
      const hr = el("tr");
      cols.forEach(function (h) { hr.appendChild(el("th", "", h)); });
      table.appendChild(hr);
    }

    list.forEach(function (st) {
      const card = el("div", "stage" + (st.stage === best ? " best" : ""));
      const hasCount = st.stage !== "order";
      card.appendChild(el("div", "head", L.head[st.stage] + per100(st.rate) + "%"));
      card.appendChild(el("div", "sub", L.sub[st.stage](money(st.count), money(st.of))));
      const table = el("table");
      head(table, [""].concat(hasCount ? [L.col[st.stage]] : []).concat([L.col.orders]).concat(price ? [L.col.gain] : []));
      const now = el("tr", "now");
      now.appendChild(el("td", "step", L.now_row + per100(st.rate) + "%"));
      if (hasCount) now.appendChild(el("td", "", money(st.count)));
      now.appendChild(el("td", "", cnt(v.orders)));
      if (price) moneyCell(now, v.orders, v.orders, price, true);
      table.appendChild(now);
      st.rows.forEach(function (r) {
        const tr = el("tr");
        tr.appendChild(el("td", "step", "+" + r.step + "% → " + per100(r.rate) + "%"));
        if (hasCount) tr.appendChild(el("td", "", cnt(r.count)));
        tr.appendChild(el("td", "", cnt(r.orders)));
        if (price) moneyCell(tr, r.orders, v.orders, price, false);
        table.appendChild(tr);
      });
      card.appendChild(table);
      if (st.stage === best) card.appendChild(el("div", "badge", L.best_badge));
      res.appendChild(card);
    });

    if (t.together.length) {
      const card = el("div", "stage all");
      card.appendChild(el("div", "head", L.all_head));
      card.appendChild(el("div", "sub", L.all_sub));
      const table = el("table");
      head(table, ["", L.col.orders].concat(price ? [L.col.gain] : []));
      const now = el("tr", "now");
      now.appendChild(el("td", "step", L.now_all));
      now.appendChild(el("td", "", cnt(v.orders)));
      if (price) moneyCell(now, v.orders, v.orders, price, true);
      table.appendChild(now);
      t.together.forEach(function (r) {
        const tr = el("tr");
        tr.appendChild(el("td", "step", L.each(r.step)));
        tr.appendChild(el("td", "", cnt(r.orders)));
        if (price) moneyCell(tr, r.orders, v.orders, price, false);
        table.appendChild(tr);
      });
      card.appendChild(table);
      res.appendChild(card);
    }
  }

  function payload() {
    const out = { v: 2 };
    FIELDS.forEach(function (f) { out[f] = num(f) || 0; });
    return JSON.stringify(out);
  }
  function send() { if (tg && inTelegram) { tg.sendData(payload()); } }

  const btn = document.getElementById("send");
  btn.textContent = L.send;
  btn.addEventListener("click", send);
  function setSend(on) {
    if (inTelegram && tg.MainButton) {
      tg.MainButton.setText(L.send);
      if (on) tg.MainButton.show(); else tg.MainButton.hide();
    } else {
      btn.style.display = on ? "block" : "none";  // в обычном браузере (проверка) — своя кнопка
    }
  }
  if (inTelegram && tg.MainButton) tg.MainButton.onClick(send);
  render();
})();
</script>
</body>
</html>
